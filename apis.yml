name: MojiLala
description: >-
  MojiLala was a marketplace for stickers, GIFs, and emoji that offered a
  content API and mobile SDKs so developers could embed searchable sticker and
  animated-sticker packs into messaging and social apps. Backed by 500 Global,
  the team subsequently pivoted to LEO AR (leoapp.com), a consumer augmented
  reality application for creating, transforming, and sharing AR experiences.
  As of this profiling the original MojiLala developer surface at mojilala.com
  is offline (returns HTTP 403/530) and the active property, leoapp.com, is a
  single-page marketing/app site that publishes no public developer API,
  documentation, or well-known discovery endpoints. This profile is retained as
  a network lead; no live API artifacts were discoverable.
